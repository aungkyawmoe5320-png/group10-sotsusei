{% extends "base.html" %}
{% block title %}お困りサポート | みまもりケアリンク{% endblock %}
{% block content %}
{% url 'dashboard' as back %}{% include "includes/back_button.html" with url=back %}
<h1 class="h4 mb-1"><i class="bi bi-life-preserver text-success"></i> お困りサポート</h1>
<p class="text-muted">知りたい内容を選んでください。</p>
<div class="row g-3">
  <div class="col-md-6">
    <a href="{% url 'care_steps' %}" class="card h-100 shadow-sm text-decoration-none text-body">
      <div class="card-body text-center p-4">
        <i class="bi bi-list-ol display-4 text-success"></i>
        <h2 class="h4 mt-2">介護手順</h2>
        <p class="text-muted mb-0">体の向きと内容を選んで、介護のやり方を調べます。</p>
      </div>
    </a>
  </div>
  <div class="col-md-6">
    <a href="{% url 'support_emergency' %}" class="card h-100 shadow-sm text-decoration-none text-body border border-danger">
      <div class="card-body text-center p-4">
        <i class="bi bi-exclamation-triangle-fill display-4 text-danger"></i>
        <h2 class="h4 mt-2">緊急対応</h2>
        <p class="text-muted mb-0">いまの状況に近いイラストを選んで、対応を調べます。</p>
      </div>
    </a>
  </div>
</div>
{% endblock %}

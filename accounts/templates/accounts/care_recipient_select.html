{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h4 mb-1">要介護者を選んでください</h1>
  <p class="text-muted">どなたの情報を使いますか？（あとから、アカウント画面で切り替えられます）</p>
  <form method="post" class="list-group shadow-sm">
    {% csrf_token %}
    {% for r in recipients %}
    <button type="submit" name="recipient_id" value="{{ r.pk }}" class="list-group-item list-group-item-action fs-5 py-3 d-flex justify-content-between align-items-center">
      <span><i class="bi bi-person-heart me-2 text-success"></i>{{ r.name }}</span>
      {% if r.pk == selected_id %}<span class="badge text-bg-success">選択中</span>{% endif %}
    </button>
    {% endfor %}
  </form>
</div></div>
{% endblock %}
